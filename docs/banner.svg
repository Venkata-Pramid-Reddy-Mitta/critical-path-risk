<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="critical-path-risk: schedule blast-radius propagation banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#162440"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)" opacity="0.45"/>
  <rect x="0" y="0" width="8" height="320" rx="4" fill="url(#accent)"/>

  <!-- Left column: title, tagline, headline pills -->
  <text x="56" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#fb923c" letter-spacing="2">SCHEDULE RISK PROPAGATION ENGINE</text>
  <text x="56" y="114" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#f8fafc">critical-path-risk</text>
  <text x="56" y="150" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#cbd5e1">Ranks tasks by true slip blast radius across the dependency DAG,</text>
  <text x="56" y="175" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#cbd5e1">not by adding up non-additive total-float columns.</text>

  <!-- Metric pills -->
  <g transform="translate(56, 206)">
    <rect x="0" y="0" width="196" height="68" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="16" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="800" fill="#f97316">56d -&gt; 11d</text>
    <text x="16" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">5.1x float overstatement</text>

    <rect x="212" y="0" width="188" height="68" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="228" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="800" fill="#fbbf24">AM1 #9</text>
    <text x="228" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">3d float, re-routes at 4d</text>

    <rect x="416" y="0" width="192" height="68" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="432" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="800" fill="#38bdf8">100%</text>
    <text x="432" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">of 1,000 random graphs</text>
  </g>

  <!-- Right column: DAG propagation visual -->
  <g transform="translate(710, 34)">
    <rect x="0" y="0" width="444" height="252" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#94a3b8">DEPENDENCY GRAPH: SHARED FLOAT vs RE-ROUTING</text>

    <!-- Critical Path (top row) -->
    <line x1="68" y1="84" x2="152" y2="84" stroke="#ef4444" stroke-width="3"/>
    <line x1="192" y1="84" x2="276" y2="84" stroke="#ef4444" stroke-width="3"/>
    <line x1="316" y1="84" x2="380" y2="84" stroke="#ef4444" stroke-width="3"/>

    <!-- Re-route dashed path through AM1 -->
    <path d="M 52 100 Q 112 146 172 146 Q 236 146 296 100" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-dasharray="6,4"/>

    <!-- Shared float chain DM1..DM4 (bottom row) -->
    <line x1="82" y1="204" x2="150" y2="204" stroke="#38bdf8" stroke-width="2.2"/>
    <line x1="194" y1="204" x2="262" y2="204" stroke="#38bdf8" stroke-width="2.2"/>
    <line x1="306" y1="204" x2="374" y2="204" stroke="#38bdf8" stroke-width="2.2"/>

    <!-- Critical nodes -->
    <circle cx="52" cy="84" r="18" fill="#450a0a" stroke="#ef4444" stroke-width="2.5"/>
    <text x="52" y="88" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#fecaca">CM1</text>

    <circle cx="172" cy="84" r="18" fill="#450a0a" stroke="#ef4444" stroke-width="2.5"/>
    <text x="172" y="88" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#fecaca">AM2</text>

    <circle cx="296" cy="84" r="18" fill="#450a0a" stroke="#ef4444" stroke-width="2.5"/>
    <text x="296" y="88" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#fecaca">TD3</text>

    <circle cx="396" cy="84" r="18" fill="#450a0a" stroke="#ef4444" stroke-width="2.5"/>
    <text x="396" y="88" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#fecaca">TD4</text>

    <!-- AM1 near-critical node -->
    <rect x="138" y="130" width="68" height="32" rx="16" fill="#451a03" stroke="#fbbf24" stroke-width="2.2"/>
    <text x="172" y="150" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#fde68a">AM1 3d</text>
    <text x="220" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24">+4d re-routes path</text>

    <!-- DM chain nodes -->
    <rect x="34" y="190" width="48" height="28" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="58" y="208" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#bae6fd">DM1</text>

    <rect x="150" y="190" width="48" height="28" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="174" y="208" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#bae6fd">DM2</text>

    <rect x="262" y="190" width="48" height="28" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="286" y="208" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#bae6fd">DM3</text>

    <rect x="374" y="190" width="48" height="28" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="398" y="208" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#bae6fd">DM4</text>

    <text x="222" y="238" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#7dd3fc">Shared chain buffer: 11d true (56d column sum)</text>
  </g>
</svg>
