name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff and the em-dash guard)
        run: |
          ruff check .
          python tools/check_no_emdash.py

      - name: Tests with branch coverage
        run: |
          mkdir -p reports
          python -m pytest -q \
            --cov=cpr --cov-branch \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --junitxml=reports/junit.xml

      - name: Coverage floor
        run: |
          python - <<'PY'
          import json
          pct = json.load(open("coverage.json"))["totals"]["percent_covered"]
          floor = 95.0
          print(f"line coverage {pct:.1f}%, floor {floor}%")
          raise SystemExit(0 if pct >= floor else 1)
          PY

      - name: Re-measure numbers and check the prose
        run: |
          python tools/collect_metrics.py --skip-tests
          python tools/check_numbers.py

      - name: Awkward table to the job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path("docs/metrics.json")
          if not path.exists():
              raise SystemExit(0)
          m = json.loads(path.read_text(encoding="utf-8"))["metrics"]
          print("### critical-path-risk: the numbers it would rather not publish\n")
          print("| Claim | Value |")
          print("| --- | --- |")
          print(f"| Float column overstates the data chain | {m['worst_chain_apparent_days']}d apparent vs {m['worst_chain_shared_days']}d shared ({m['overstatement_ratio']}x) |")
          print(f"| Non-obvious task AM1 re-routes at | {m['rerouting_days']}-day slip |")
          print(f"| Joint blind spot (single-slip cannot see) | two safe slips, go-live +{m['joint_delay_days']}d |")
          print(f"| Overstated across {m['robustness_programs']} random programs | {m['robustness_overstated_pct']}% |")
          PY

      - name: Upload experiment JSON and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-py${{ matrix.python-version }}
          path: |
            docs/metrics.json
            docs/experiments/*.json

  runtime-no-extras:
    name: runtime imports with zero dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install without any extras
        run: python -m pip install -e .

      - name: The runtime must import and run on the standard library alone
        run: |
          python -c "import cpr; from cpr.model import Schedule; from cpr.analysis import analyze; from cpr.config import Policy; print('runtime ok, version:', cpr.__version__)"
          set +e
          python -m cpr.cli analyze fixtures/program.json --quiet --gate
          rc=$?
          set -e
          echo "gate exit code: $rc"
          test "$rc" -eq 2
